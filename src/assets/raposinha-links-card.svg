<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1813 868" role="img" aria-labelledby="title desc">
  <title id="title">Página centralizadora de links da Raposinha Live</title>
  <desc id="desc">Painel roxo Meus Links com atalhos para Twitch, YouTube, Discord, Instagram e outros links.</desc>
